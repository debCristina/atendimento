services:
  postgres:
    image: postgres:17
    container_name: atendimento-postgres
    environment:
      POSTGRES_DB: atendimento
      POSTGRES_USER: atendimento
      POSTGRES_PASSWORD: atendimento
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atendimento -d atendimento"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.4
    container_name: atendimento-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
  app:
    build: .
    container_name: atendimento-app
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/atendimento
      DB_USER: atendimento
      DB_PASSWORD: atendimento
      ELASTIC_URI: http://elasticsearch:9200
      JWT_SECRET: ${JWT_SECRET:-docker-local-secret-key-for-development-only}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  elastic-data: