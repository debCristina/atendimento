spring:
  application:
    name: atendimento

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/atendimento}
    username: ${DB_USER:atendimento}
    password: ${DB_PASSWORD:atendimento}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  elasticsearch:
    uris: ${ELASTIC_URI:http://localhost:9200}

jwt:
  secret: ${JWT_SECRET:atendimento-local-secret-key-for-development}
  expiration: ${JWT_EXPIRATION:1h}

app:
  admin:
    name: ${ADMIN_NAME:Administrador}
    email: ${ADMIN_EMAIL:admin@atendimento.com}
    password: ${ADMIN_PASSWORD:admin12345}